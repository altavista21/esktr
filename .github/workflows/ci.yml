name: CI
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Validate Prisma schema
        run: npm run db:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/esktr?schema=public
      - name: Build
        run: npm run build
